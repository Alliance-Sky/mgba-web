<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="mGBA-Web - A web-based Game Boy (GB), Game Boy Color (GBC), and Game Boy Advance (GBA) emulator" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mGBA-Web | GB, GBC & GBA Emulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red; font-size:20px; z-index:999999; position:absolute; top:0; left:0; background:white; padding:20px;">' + message + '<br>' + (error ? error.stack : '') + '</div>';
      };
      window.onunhandledrejection = function(event) {
        document.body.innerHTML += '<div style="color:red; font-size:20px; z-index:999999; position:absolute; top:0; left:0; background:white; padding:20px;">Unhandled Promise Rejection: ' + event.reason + '</div>';
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
